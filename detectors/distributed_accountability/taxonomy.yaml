id: distributed_accountability
# Capability declaration. Moved here 2026-09-01 from three hardcoded sets in
# eval/gold_check.py, tools/harvest_gold.py and tools/export_web.py -- one of which
# silently decided which engine features got parity-tested. A lens declares what it
# can do; tools ask the lens.
reads: text               # reads prose
cue_matching: unsupported        # literal cue matching cannot judge these markers; the UI greys the lens out rather than reporting a misleading 0
name: Distributed Accountability
description: "Measures the NO-ONE-DECIDES move — Kierkegaard's \"the crowd is untruth\" + Nietzsche's\
  \ ascetic priest: responsibility dissolves into the system so no individual is answerable, while the\
  \ institution claims jurisdiction over what is true and reframes dissent as a moral fault. The Ratchet's\
  \ attribution-gap signature. Ideology-blind: fires the same on an algorithmic moderation regime, a committee,\
  \ a \"the science is settled\" gatekeeper, or a compliance bureaucracy. Detects the structural/rhetorical\
  \ move, never the position taken.\n\nGOLD DRIFT, classified 2026-09-01. The gold slots below do not\
  \ detect and should be REPLACED rather than matched with new cues, because they are not specimens of\
  \ the marker:\n  crowd-is-truth -- Kierkegaard's 'The crowd is untruth' is the INVERSE of this marker\n\
  A lens whose positive examples are DESCRIPTIONS of a group learns to detect the description. That is\
  \ the self/about contamination the corpus design guards against, arriving from inside the taxonomy where\
  \ nobody was looking."
config:
  marker_present_threshold: 0.3
  w_breadth: 0.55
  w_intensity: 0.3
  w_density: 0.15
  density_cap_per_1k: 6.0
  tiers:
  - min: 0.0
    label: incidental
  - min: 35.0
    label: notable
  - min: 60.0
    label: dense diffusion-of-accountability (review)
markers:
- id: nobody_decides
  name: No identifiable decider
  base_weight: 1.0
  detections:
  - id: diffuse-agency
    weight: 1.0
    definition: The action is attributed to a system / policy / process / algorithm so no person is accountable.
    cues:
    - the system flagged
    - the algorithm decided
    - out of our hands
    - the process determined
    - nobody decided
    - it was flagged
    - actioned automatically
    - no individual reviewed
    - under policy, not by
    gold:
    - text: the account was actioned automatically under policy; no individual reviewer made the call
      source: illustrative — diffuse-agency cue (not a quotation)
  - id: crowd-is-truth
    weight: 0.85
    definition: Legitimacy located in the collective/consensus rather than any answerable judgment.
    cues:
    - the community decided
    - the public demands
    - we as a society
    gold:
    - text: The crowd is untruth.
      source: Søren Kierkegaard, The Point of View (on 'the crowd')
- id: jurisdiction_over_truth
  name: Ascetic priest — jurisdiction over truth
  base_weight: 1.0
  detections:
  - id: authority-to-define-true
    weight: 1.0
    definition: The institution claims the authority to define what is true / permissible to say, and
      to gatekeep it.
    cues:
    - authoritative source
    - the settled view
    - we decide what is
    - harmful falsehood
    - the official position
    - malinformation
    - cognitive infrastructure
    gold:
    - text: only the designated authoritative sources may define what counts as accurate; the rest is
        misinformation
      source: illustrative — authority-to-define-true cue (not a quotation)
- id: moralized_dissent
  name: Dissent reframed as moral fault
  base_weight: 0.95
  detections:
  - id: disagreement-as-sin
    weight: 1.0
    definition: Disagreement recast as a moral failing, harm, or danger rather than a position to be argued.
    cues:
    - on the wrong side of history
    - denialist
    - you are part of the problem
    - morally indefensible
    - literal violence
    gold:
    - text: to question the measure is itself to cause harm and place yourself on the wrong side of history
      source: illustrative — disagreement-as-sin cue (not a quotation)
- id: unfalsifiable_consensus
  name: Unchallengeable consensus
  base_weight: 0.9
  detections:
  - id: settled-beyond-question
    weight: 1.0
    definition: A claim placed beyond challenge — settled, the experts agree, debate is over.
    cues:
    - the debate is over
    - no serious person disputes
    - beyond question
    - asked and answered
    - not up for debate
    gold:
    - text: the science is settled and the debate is over; further questions are not legitimate
      source: illustrative — settled-beyond-question cue (not a quotation)
