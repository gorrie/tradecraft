- id: maga_new_right
  name: MAGA / populist new-right register
  base_weight: 1.0
  detections:
  - id: maganr-tells
    weight: 1.0
    definition: 'Coined idiom of the MAGA / populist new-right canon. ("the deep state" omitted — shared
      with QAnon and now mainstream; "america first" omitted — historical + descriptive dual-use.) "RINO"
      CUT (rhinoceros abbreviation); enriched with exclusive slogans instead.

      "drain the swamp" is KEPT, with a literal-drainage exclusion. This definition previously
      recorded it as CUT while the cue sat in the list below and supplied the detection''s only
      gold example — a three-way disagreement between definition, cues and gold, corrected
      2026-09-03 in favour of the cue. Measured before deciding: across PTC''s 371 articles it
      supplies 7 of this detection''s 11 hits and 4 of its 8 in-span landings, and this is the
      strongest detection in the entire taxonomy (lift 5.49) and the best Slogans detector we
      have. Cutting it would have halved our best instrument to fix one negative fixture.

      '
    cues:
    - the uniparty
    - stop the steal
    - let's go brandon
    - make america great again
    - drain the swamp
    # Literal wetland drainage is a real sense of the phrase and it fired the lens on
    # sub_neg_literal_drain_swamp -- "the county hired workers to drain the swamp behind the
    # school to stop the mosquitoes". Match-local, so a metaphorical use elsewhere in the same
    # document still fires. Measured against all 7 PTC occurrences before landing: 0 are
    # suppressed, so the political sense is untouched and the 4 in-span landings survive.
    excludes:
    - mosquito
    - wetland
    - drainage
    - stagnant water
    gold:
    - text: drain the swamp
      source: Trump-era populist-right slogan — documented coinage [COINAGE]
