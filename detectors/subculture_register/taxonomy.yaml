- id: tankie_mlm
  name: Tankie / Marxist-Leninist-Maoist register
  base_weight: 1.0
  detections:
  - id: tankie-tells
    weight: 1.0
    definition: 'Coined idiom of the Marxist-Leninist / Maoist ("tankie") sub-camp — distinct from the
      anarchist wing of revolutionary_left; the two overlap and a text may fire both.

      '
    cues:
    - actually existing socialism
    - dialectical materialism
    - critical support
    - marxism-leninism-maoism
    # Three cues ADDED 2026-09-03 by running the shibboleth method over Lenin's own canon
    # (Imperialism + Left-Wing Communism, 73,130 words) against Marx and Engels as the
    # discipline-matched control (74,628 words). Numbers in
    # eval/RESULTS-2026-09-03-lenin-canon-mine.md.
    #
    # They are kept on a basis that does NOT depend on the control being complete, which
    # matters because a control is always missing something -- the Marx set here has no
    # Critique of the Gotha Programme, and that single gap is why `dictatorship of the
    # proletariat` measured 0 in the control and was NOT taken. These three are
    # CHRONOLOGICALLY IMPOSSIBLE in classical Marxism: Marx died in 1883, Hilferding coined
    # finance capital in 1910, the Second International was founded in 1889, and the Left
    # Communists were a 1918 faction. No amount of missing Marx could put them in his corpus.
    # Lenin's own text dates one of them for us: "the period of the Second International --
    # that is, of the twenty-five years between 1889 and 1914".
    - finance capital
    - second international
    - left communists
    gold:
    - text: actually existing socialism
      source: Marxist-Leninist apologetic lexicon — documented coinage [COINAGE]
    - text: '"An increasing proportion of industrial capital," says Hilferding, "does not belong
        to the industrialists who employ it."'
      source: FOUND IN THE WILD — V. I. Lenin, Imperialism, the Last Stage of Capitalism (1926
        edn), ch. 3, via en.wikisource.org. Public domain.
    - text: In this matter of defining imperialism it is chiefly with Karl Kautsky, the principal
        Marxist theoretician of the period of the Second International—that is, of the
        twenty-five years between 1889 and 1914—that issue must be joined
      source: FOUND IN THE WILD — V. I. Lenin, Imperialism, the Last Stage of Capitalism (1926
        edn), ch. 7, via en.wikisource.org. Public domain.
    - text: The German Left Communists with the greatest contempt—and the greatest
        lightmindedness—reply to this question in the negative.
      source: 'FOUND IN THE WILD — V. I. Lenin, Left-Wing Communism: an Infantile Disorder
        (1920), via en.wikisource.org. Public domain.'
