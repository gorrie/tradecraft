id: subculture_register
# Capability declaration. Moved here 2026-09-01 from three hardcoded sets in
# eval/gold_check.py, tools/harvest_gold.py and tools/export_web.py -- one of which
# silently decided which engine features got parity-tested. A lens declares what it
# can do; tools ask the lens.
reads: text               # reads prose
cue_matching: supported        # cue matching is a valid floor backend for these markers
name: Subculture Register (true-believer tells)
description: 'Fingerprints DISCOURSE-COMMUNITY membership from the coined idiom and oddities a camp''s
  true believers use or allude to — the shibboleths that are near-exclusive to one register and effectively
  absent from general prose ("false consciousness," "compulsory heterosexuality," "malinformation," "day
  of the rope," "society of the spectacle," "north star metric," "update my priors"). This is the precision
  half of the tool: unlike a repurposed common word, a coined tell IS the membership marker, so it is
  a high-precision signal by construction. METHOD NOT IDEOLOGY, and DESCRIPTIVE not evaluative (load-bearing):
  the lens reports WHICH register a text speaks, never that the register is good or bad, and it is built
  SYMMETRICALLY — a marker for every camp (revolutionary-left, accelerationist-right, radical-feminist,
  critical-social-justice, the disinformation apparatus, managerial-technocratic, rationalist/AI-safety,
  and more as the corpus study lands them). Detections for everyone. A single tell is a flag for a human,
  never a verdict. Each cue is a coined, near-exclusive phrase; benign-ubiquitous words are deliberately
  excluded (that is the whole point — see BACKLOG-shibboleth-corpus-study.md and eval/RESULTS-2026-08-01-fp-sweep.md).
  Seeded + widened 2026-08-01 from fetched real primaries — Marx/Engels (Communist Manifesto), Debord
  (Society of the Spectacle), Bonanno (Armed Joy), de Cleyre (Direct Action), Hanisch (The Personal Is
  Political), McIntosh (Invisible Knapsack), Bostrom (Existential Risks) — plus documented coinages for
  camps not yet fetched. The corpus study (BACKLOG) deepens each camp toward ≥2 recall-validated works.
  Tags: [PRIMARY] = mined from a fetched primary work; [COINAGE] = documented origin of the term.

  '
config:
  marker_present_threshold: 0.3
  w_breadth: 0.55
  w_intensity: 0.3
  w_density: 0.15
  density_cap_per_1k: 6.0
  tiers:
  - min: 0.0
    label: incidental
  - min: 35.0
    label: register present
  - min: 60.0
    label: dense in-group register (review)
markers:
- id: revolutionary_left
  name: Revolutionary-left / Marxist / Situationist register
  base_weight: 1.0
  detections:
  - id: marxist-situationist-tells
    weight: 1.0
    definition: 'Coined idiom of the revolutionary-left canon — classical-Marxist, Leninist, and Situationist
      tells that a benign writer does not reach for.

      '
    cues:
    - class struggle
    - false consciousness
    - dictatorship of the proletariat
    - seize the means
    - propaganda of the deed
    - vanguard party
    - society of the spectacle
    - heighten the contradictions
    - bourgeoisie
    - proletariat
    - means of production
    - class consciousness
    - surplus value
    - commodity fetishism
    - wage labour
    - wage-labour
    - the proletarians
    - pseudo-need
    - spectacular society
    # Two cues ADDED 2026-09-03 from the camp's own canon (Marx & Engels, 74,628 words: the
    # Manifesto, Wage-Labor and Capital, The Poverty of Philosophy) against Adam Smith as the
    # discipline-matched control. Both occur ZERO times in 418,000 words of Smith, so they are
    # Marxist register rather than classical political economy.
    # `means of production` above was independently re-surfaced by the same run, which is a
    # small validation that the method finds real cues rather than only novel ones.
    # Numbers: eval/RESULTS-2026-09-03-revleft-canon-mine.md.
    - productive forces
    - petty bourgeois
    gold:
    - text: class struggle
      source: Alfredo M. Bonanno, Armed Joy (1977) — theanarchistlibrary.org, mined 2026-08-01 [PRIMARY]
    - text: the society of the spectacle
      source: Guy Debord, La société du spectacle (1967) — Situationist coinage [COINAGE]
    - text: The bourgeoisie, during its rule of scarce one hundred years, has created more
        massive and more colossal productive forces than have all preceding generations together.
      source: FOUND IN THE WILD — Marx & Engels, Manifesto of the Communist Party (1848), pt 1,
        via en.wikisource.org. Public domain.
    - text: the petty bourgeois, under the yoke of feudal absolutism, managed to develop into a
        bourgeois
      source: FOUND IN THE WILD — Marx & Engels, Manifesto of the Communist Party (1848), pt 1,
        via en.wikisource.org. Public domain.
