id: legibility
# Capability declaration. Moved here 2026-09-01 from three hardcoded sets in
# eval/gold_check.py, tools/harvest_gold.py and tools/export_web.py -- one of which
# silently decided which engine features got parity-tested. A lens declares what it
# can do; tools ask the lens.
reads: text               # reads prose
cue_matching: unsupported        # literal cue matching cannot judge these markers; the UI greys the lens out rather than reporting a misleading 0
name: Legibility as Control
description: 'Measures the LEGIBILITY move — James C. Scott''s "Seeing Like a State": rendering a complex,
  local, tacit reality into a simplified, standardized, centrally-readable form, because what the center
  can see it can manage, tax, and exclude. The structural backbone of The Ratchet (the click before the
  pawl). Ideology-blind by construction: fires the same on a public-health registry, a corporate data-lake,
  a content-moderation taxonomy, or a five-year plan. Detects the RHETORICAL move (standardize / register
  / make-visible / manage-to-the-metric), never the policy''s team. NOTE (2026-08 FP audit): legibility
  is largely an ANALYTIC concept — its natural vocabulary (standardize, registry, observability, data-driven,
  best-practices) is benign-ubiquitous engineering language, so most cues were cut as false-positive bait.
  This lens is near-inert on the cue floor alone and leans on the verify layer + co-occurrence; it is
  not a shibboleth lens.


  cue list repaired 2026-09-01 against the lens''s own gold, which it detected 0 of 8. impose-uniformity
  shipped with an empty cue list. Cues added are phrasings general enough to recur; the gold example "Legibility
  is a condition of manipulation" is left undetected on purpose -- it is a definition of the concept rather
  than an instance of it, and is gold drift rather than a cue gap.


  Cue removed 2026-09-01 the same day it was added: "registered with the" fired on "persons and vessels
  registered with the event sponsor as a participant in the race" -- a regatta. Registering for a boat
  race is not state legibility. The cue was too generic to survive contact with the control corpus, and
  the two genuine fires in that corpus (ballot-mail visibility, DEA controlled-substance registration)
  were caught by other cues without it.


  Real-world gold added 2026-09-01 by tools/harvest_gold.py, read and judged by hand before promotion.
  Entries marked FOUND IN THE WILD carry a source document; entries marked illustrative were composed.
  The distinction matters: a lens that detects only composed examples has been checked for self-consistency
  and not for precision.'
config:
  marker_present_threshold: 0.3
  w_breadth: 0.55
  w_intensity: 0.3
  w_density: 0.15
  density_cap_per_1k: 6.0
  tiers:
  - min: 0.0
    label: incidental
  - min: 35.0
    label: notable
  - min: 60.0
    label: dense legibility tradecraft (review)
markers:
- id: legibility_imperative
  name: Make-it-visible imperative
  base_weight: 1.0
  detections:
  - id: render-visible
    weight: 1.0
    definition: Framing that the center must be able to SEE / read the whole, as a precondition of acting
      on it.
    cues:
    - make visible
    - bring into view
    - see the whole
    - from the center
    - shine a light on
    - visibility into
    # `full visibility` KILLED 2026-09-03, over-broad and redundant. It is the phrase every
    # supply-chain deck and observability vendor uses, and it fired the lens on
    # neg_legibility_devops -- "register the service in the registry, normalize the schema,
    # and make the pipeline legible with full visibility" -- which is software engineering
    # borrowing the state's vocabulary, not a legibility move. Measured before removing: both
    # gold examples that carry it also carry `visibility into` ("full visibility INTO the
    # population"), so the narrower cue catches every genuine instance of the idiom, and the
    # phrase appears in 0 corpus documents against 2 for `visibility into`. What it uniquely
    # matched was "full visibility of/across", which is business-speak. No recall to lose.
    - complete picture of
    - know where everyone
    gold:
    - text: Legibility is a condition of manipulation.
      source: James C. Scott, Seeing Like a State (1998)
    - text: we need full visibility into the population before we can keep it safe
      source: illustrative — render-visible cue (not a quotation)
    - text: the rule will afford significantly enhanced visibility into the sending of Federal Ballot
        Mail, and this will in turn facilitate law enforcement effort
      source: FOUND IN THE WILD — US Federal Register rulemaking, corpus/_calibration-cache/2026-17238.txt.
        Visibility into a population's activity, stated as the rule's purpose.
  - id: mandatory-registration
    weight: 0.9
    definition: Requiring that people/things be registered, enumerated, catalogued, on-the-record.
    cues:
    - must be registered
    - enrolled in
    - authoritative registry
    - single registry
    - on the register
    gold:
    - text: every device, account, and transaction is enrolled in a single authoritative registry
      source: illustrative — mandatory-registration cue (not a quotation)
- id: standardization_grid
  name: Standardization / the grid
  base_weight: 1.0
  detections:
  - id: impose-uniformity
    weight: 1.0
    definition: Collapsing local/varied practice into one uniform format, standard, or grid the center
      defines.
    cues:
    - standard grid
    - centrally recorded
    - a single standard
    - uniform across
    - standardize local
    - one common format
    gold:
    - text: officials created a standard grid whereby local practice could be centrally recorded and monitored
      source: James C. Scott, Seeing Like a State (1998) — paraphrase of the core thesis
  - id: erase-local-knowledge
    weight: 0.85
    definition: Treating local, tacit, messy variety as disorder to be cleaned up / simplified away.
    cues:
    - messy reality
    - clean up the patchwork
    - eliminate ambiguity
    - one set of rules for everyone
    - no special cases
    - too messy to administer
    - must be simplified
    - patchwork of local
    - local variation
    # `eliminate ambiguity` is a real marker of the standardisation grid in argumentative
    # prose, and it is also three words of Executive Order 12988's mandatory boilerplate:
    # "This rulemaking meets applicable standards to minimize litigation, eliminate
    # ambiguity, and reduce burden as set forth in sections 3(a) and 3(b)(2)". That paragraph
    # appears in a large share of US rulemakings, so the cue was scoring nearly every federal
    # rule. Suppressed where the order names itself nearby; kept everywhere else. Measured
    # against gold_check for recall loss before and after.
    excludes:
    - executive order 12988
    - civil justice reform
    gold:
    - text: the patchwork of local arrangements is simply too messy to administer and must be simplified
      source: illustrative — erase-local-knowledge cue (not a quotation)
- id: metric_as_reality
  name: The metric becomes the territory
  base_weight: 0.95
  detections:
  - id: manage-to-the-metric
    weight: 1.0
    definition: Treating the simplified measure as the thing itself — managing, optimizing, or excluding
      by the number.
    cues:
    - optimize the number
    - the score is the decision
    - over the threshold
    - below the threshold
    - the metric becomes the target
    gold:
    - text: if the risk score is over the threshold, access is denied — the score is the decision
      source: illustrative — manage-to-the-metric cue (not a quotation)
- id: mandatory_identification
  name: Identity as the gate
  base_weight: 0.95
  detections:
  - id: id-as-precondition
    weight: 1.0
    definition: Making verified identity / disclosure the precondition of participating at all.
    cues:
    - prove who you are
    - no anonymity
    - identity-first
    - authenticated to participate
    - verified digital identity
    - without an authenticated
    - may not participate without
    - identity is required to
    gold:
    - text: no one may post, pay, or travel without an authenticated, verified digital identity
      source: illustrative — id-as-precondition cue (not a quotation)
- id: high_modernist_confidence
  name: High-modernist confidence
  base_weight: 0.9
  detections:
  - id: design-over-organic
    weight: 1.0
    definition: Expert/rational-design certainty that a centrally-engineered scheme improves on messy
      organic order.
    cues:
    - scientific administration
    - centrally planned
    - engineer society
    - optimal allocation
    - we know better
    - rationally designed
    - administered by experts
    - better than the spontaneous
    - allocate more efficiently than
    gold:
    - text: a rationally designed system, administered by experts, will allocate far better than the spontaneous
        muddle it replaces
      source: illustrative — design-over-organic cue (high-modernist register per Scott)
